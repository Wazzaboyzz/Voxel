name: Test Image Secret

on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Test image generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_images.py "a friendly 3D cartoon cloud character, pixar style" test_slide
      - name: Show result
        run: ls -la output/images/ 2>/dev/null || echo "NO IMAGE WAS CREATED - secret missing or invalid"
