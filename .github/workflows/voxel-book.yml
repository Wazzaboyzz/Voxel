name: Voxel Book (one command)

# Manual trigger only. Actions tab -> "Voxel Book (one command)" -> Run
# workflow. Fill in the concept, wait, download the finished PDFs from
# the run's "Artifacts" section.

on:
  workflow_dispatch:
    inputs:
      concept:
        description: "Book concept/theme (full sentence)"
        required: true
        type: string
      pages:
        description: "Number of pages"
        required: false
        default: "26"
        type: string
      trim:
        description: "Trim size"
        required: false
        default: "8.5x11"
        type: choice
        options:
          - "8.5x8.5"
          - "8.5x11"
          - "6x9"
          - "5x8"
      paper:
        description: "Paper type"
        required: false
        default: "white"
        type: choice
        options:
          - "white"
          - "cream"
      coloring_book:
        description: "Coloring book (uncheck for illustrated story book)"
        required: false
        default: false
        type: boolean
      series:
        description: "Story-bible series slug for sequels, e.g. 'luna'. Leave blank for a standalone book."
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run voxel_cli.py book
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ARGS="--concept \"${{ inputs.concept }}\" --pages ${{ inputs.pages }} --trim ${{ inputs.trim }} --paper ${{ inputs.paper }}"
          if [ "${{ inputs.coloring_book }}" = "true" ]; then ARGS="$ARGS --coloring-book"; fi
          if [ -n "${{ inputs.series }}" ]; then ARGS="$ARGS --series ${{ inputs.series }}"; fi
          eval python voxel_cli.py book $ARGS

      - name: Upload finished book (PDFs + project.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxel-book-output
          path: output_books/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit updated story bible
        if: always()
        run: |
          git config user.name "voxel-bot"
          git config user.email "actions@github.com"
          git add story_bibles/ || true
          git diff --cached --quiet || git commit -m "Update story bible after book run (Actions)"
          git push || true
